name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    name: Backend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore local tools (dotnet-ef, версия зафиксирована в .config/dotnet-tools.json)
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore backend/backend.sln

      - name: Build
        run: dotnet build backend/backend.sln -c Release --no-restore

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (строго по package-lock.json)
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: /api

  images:
    name: Release-артефакты (docker images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        run: cp .env.example .env

      - name: Build images (Build-этап, п. 5)
        run: docker compose build
