apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: default
data:
  script.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';

    export const options = {
        vus: 1,
        duration: '24h'
    };

    const API_URL = 'http://api:8080/api/Habits';

    export default function () {
        http.get(API_URL);
       
        const payload = JSON.stringify({
            Name: `Test Habit ${Date.now()}`,
            Period: 7,
            TargetCount: 2
        });
        const params = {
            headers: { 'Content-Type': 'application/json' }
        };
        http.post(API_URL, payload, params);
        
        sleep(0.1);
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-prober
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k6-prober
  template:
    metadata:
      labels:
        app: k6-prober
    spec:
      containers:
        - name: k6
          image: grafana/k6:latest
          args: ["run", "/scripts/script.js"]
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: script
          configMap:
            name: k6-script