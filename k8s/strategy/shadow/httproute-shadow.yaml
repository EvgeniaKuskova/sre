apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shadow
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: api-v1
          port: 8080
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: api-v2
              port: 8080