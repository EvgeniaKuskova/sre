server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Имя "api" = имя Service в k8s = имя сервиса в docker-compose.
    # ВАЖНО: proxy_pass с литеральным именем (без переменной $...) заставляет
    # nginx резолвить DNS при старте через системный /etc/resolv.conf —
    # он применяет search-домены (default.svc.cluster.local и т.д.).
    # Раньше здесь была переменная set $backend "http://api:8080" + resolver
    # 10.96.0.10: nginx в этом режиме НЕ использует search-домены и спрашивает
    # у DNS "api" как TLD в корне зоны -> SERVFAIL -> 502 Bad Gateway.
    # Отсюда требование: Service api должен существовать до старта этого пода
    # (файлы применяются по порядку: 03-api.yaml -> 04-web.yaml).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: несуществующие маршруты отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
